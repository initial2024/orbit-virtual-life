name: Verify owned Orbit game domains
on:
  push:
    branches:
      - release/isolated-offline-preview-gate-20261102
    paths:
      - scripts/verify-owned-game-domains.mjs
      - .github/workflows/verify-owned-game-domains.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - run: node scripts/verify-owned-game-domains.mjs
