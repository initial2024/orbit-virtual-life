name: D32 Payroll Ownership Gate Once

on:
  push:
    branches: [work/d32-payroll-ownership-gate]
    paths: [.github/workflows/d32-payroll-ownership-gate-once.yml]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Run repository verification
        run: npm run verify
      - name: Run SQLite concurrency and payroll ownership gate
        run: python3 tests/payroll_atomic_sqlite_gate.py
      - name: Assert household planner has no executable transfer API
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "planPaycheckTransfers" src tests
          grep -q "executionAuthority:'server_payroll'" src/household-cashflow.mjs
          grep -q "PAYROLL_AUTHORITY_MISMATCH" migrations/0002_payroll_atomic_candidate.sql
